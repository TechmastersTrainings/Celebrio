services:
  - type: web
    name: celebrio-backend
    env: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn celebrio.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        value: techmastersinnovations@gmail.com
      - key: SEED_ADMIN_PASSWORD
        value: Fri10Feb@2023
      - key: SEED_DEV_PASSWORD
        value: Fri10Feb@2023
