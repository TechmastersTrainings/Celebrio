version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: celebrio_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-celebrio_db}
      POSTGRES_USER: ${POSTGRES_USER:-celebrio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_postgres_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: celebrio_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: celebrio_backend
    restart: always
    depends_on:
      - db
      - redis
    environment:
      DEBUG: "${DEBUG:-False}"
      SECRET_KEY: "${SECRET_KEY:-change_this_django_secret_key_in_production}"
      DATABASE_URL: "${DATABASE_URL:-postgres://celebrio_user:change_this_postgres_password@db:5432/celebrio_db}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    ports:
      - "8000:8000"

  video_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: celebrio_video_worker
    restart: always
    depends_on:
      - db
      - redis
    command: ["celery", "-A", "celebrio", "worker", "-Q", "video_render", "-c", "2", "--loglevel=info"]
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://celebrio_user:change_this_postgres_password@db:5432/celebrio_db}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"

volumes:
  postgres_data:

