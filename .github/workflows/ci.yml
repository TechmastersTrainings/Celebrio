name: TechMasters Digital Celebrations CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django System Checks
        env:
          SECRET_KEY: 'ci-temporary-dummy-secret-key-for-testing-only'
          DEBUG: 'False'
        run: |
          cd backend
          python manage.py check

      - name: Run Backend Test Suite
        env:
          SECRET_KEY: 'ci-temporary-dummy-secret-key-for-testing-only'
          DEBUG: 'False'
        run: |
          cd backend
          python manage.py test tests

  frontend-build:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Check and Vite Production Build
        run: |
          cd frontend
          npm run build

  security-audit:
    name: Repository Security & Environment Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify no committed secret files
        run: |
          if ls .env .env.local backend/.env backend/db.sqlite3 1> /dev/null 2>&1; then
            echo "SECURITY VIOLATION: Sensitive environment or local database file detected!"
            exit 1
          fi
          echo "Environment hygiene verified. No sensitive files tracked."
